apiVersion: apps/v1
kind: Deployment

metadata:
  name: report-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: report-service

  template:
    metadata:
      labels:
        app: report-service

    spec:
      containers:
      - name: report-service
        image: docker.io/dhiyauu/report-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8086
